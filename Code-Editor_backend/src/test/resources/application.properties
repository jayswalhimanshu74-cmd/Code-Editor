spring.application.name=Hence-Code-Test

# In-memory H2 database for unit tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Application & Security Properties
app.jwt.secret=8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000
app.cors.allowed-origins=http://localhost:5173

# Gemini API
gemini.api.key=test_gemini_key
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@hencecode.com
spring.mail.password=test_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Execution Engine
execution.provider=piston
execution.piston.url=https://emkc.org/api/v2/piston/execute
execution.judge0.url=https://judge0-ce.p.rapidapi.com/submissions?wait=true

# OAuth2 Dummy Client Credentials for testing
spring.security.oauth2.client.registration.google.client-id=dummy-google-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.github.client-id=dummy-github-client-id
spring.security.oauth2.client.registration.github.client-secret=dummy-github-client-secret
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# GitHub Token Encryption
github.token.encryption.key=12345678901234567890123456789012

# Admin configuration
admin.bootstrap.enabled=false
admin.bootstrap.secret=admin_secret

# Disable Redis during unit testing
spring.data.redis.enabled=false
spring.data.redis.repositories.enabled=false
