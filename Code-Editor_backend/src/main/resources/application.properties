spring.application.name=Hence-Code

# Profile Default Strategy (Default to 'local' profile if no profile is specified)
spring.profiles.default=local

# Optional environment file import
spring.config.import=optional:file:.env.properties

# Server
server.address=0.0.0.0
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework

# Spring Boot Actuator & Observability
management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.export.prometheus.enabled=true

# Structured MDC Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corrId=%X{correlationId:-none} reqId=%X{requestId:-none}] - %msg%n

# JPA / Hibernate Common Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:dev-only-placeholder-CHANGE-ME-32-chars-minimum}
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

# Code Execution Engine (Judge0 CE)
execution.provider=${EXECUTION_PROVIDER:judge0}
execution.judge0.mode=${EXECUTION_JUDGE0_MODE:self-hosted}
execution.judge0.url=${EXECUTION_JUDGE0_URL:https://ce.judge0.com/submissions?wait=true&base64_encoded=true}
execution.judge0.timeout=${EXECUTION_JUDGE0_TIMEOUT:10000}
execution.judge0.connect-timeout=${EXECUTION_JUDGE0_CONNECT_TIMEOUT:5000}
execution.judge0.read-timeout-buffer=${EXECUTION_JUDGE0_READ_TIMEOUT_BUFFER:5000}
execution.judge0.memory=${EXECUTION_JUDGE0_MEMORY:128000}
execution.judge0.cpu=${EXECUTION_JUDGE0_CPU:5.0}
execution.judge0.key=${EXECUTION_JUDGE0_KEY:}
execution.judge0.host=${EXECUTION_JUDGE0_HOST:}

# Gemini API for AI chat
gemini.api.key=${GEMINI_API_KEY:mock_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:jayswalhimanshu74@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis Configuration
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Lettuce Redis Connection Pool Tuning
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.timeout=3000ms
spring.data.redis.connect-timeout=3000ms

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_OAUTH_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# GitHub Token Encryption
github.token.encryption.key=${GITHUB_TOKEN_ENCRYPTION_KEY:12345678901234567890123456789012}

# Admin configuration
admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
admin.bootstrap.secret=${ADMIN_BOOTSTRAP_SECRET:admin_secret}

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.executionProvider.slidingWindowSize=10
resilience4j.circuitbreaker.instances.executionProvider.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.executionProvider.failureRateThreshold=50
resilience4j.circuitbreaker.instances.executionProvider.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.executionProvider.permittedNumberOfCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.githubService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.githubService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.githubService.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.emailService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.emailService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.emailService.waitDurationInOpenState=10s

resilience4j.retry.instances.executionProvider.maxAttempts=3
resilience4j.retry.instances.executionProvider.waitDuration=1s

resilience4j.retry.instances.githubService.maxAttempts=3
resilience4j.retry.instances.githubService.waitDuration=1s

resilience4j.retry.instances.emailService.maxAttempts=3
resilience4j.retry.instances.emailService.waitDuration=2s

resilience4j.bulkhead.instances.executionProvider.maxConcurrentCalls=10
resilience4j.bulkhead.instances.executionProvider.maxWaitDuration=500ms