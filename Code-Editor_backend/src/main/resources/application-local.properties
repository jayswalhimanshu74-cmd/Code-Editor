# ===================================================================
# LOCAL DEVELOPMENT PROFILE (application-local.properties)
# Local PostgreSQL configuration (localhost:5432/IMS)
# Active when SPRING_PROFILES_ACTIVE=local (or default)
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Hence-Code}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

execution.judge0.mode=${EXECUTION_JUDGE0_MODE:self-hosted}
execution.judge0.url=${EXECUTION_JUDGE0_URL:https://ce.judge0.com/submissions?wait=true&base64_encoded=true}
execution.judge0.key=${EXECUTION_JUDGE0_KEY:}   
execution.judge0.host=${EXECUTION_JUDGE0_HOST:}
execution.judge0.timeout=${EXECUTION_JUDGE0_TIMEOUT:10000}
execution.judge0.connect-timeout=${EXECUTION_JUDGE0_CONNECT_TIMEOUT:5000}
execution.judge0.read-timeout-buffer=${EXECUTION_JUDGE0_READ_TIMEOUT_BUFFER:5000}
execution.judge0.memory=${EXECUTION_JUDGE0_MEMORY:128000}
execution.judge0.cpu=${EXECUTION_JUDGE0_CPU:5.0}
execution.provider=${EXECUTION_PROVIDER:judge0}

# HikariCP Connection Pool (Local Tuning)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=120000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate for Local Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
