# ===================================================================
# PRODUCTION PROFILE (application-prod.properties)
# Neon PostgreSQL configuration via Environment Variables ONLY
# Active when SPRING_PROFILES_ACTIVE=prod
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-spring-mode-aykzotq2-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Neon PostgreSQL Cloud Tuned)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
